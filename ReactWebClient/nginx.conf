server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/users {
        proxy_pass http://usersservice:80/api/v1/users;
    }

    location /api/v1/posts {
        proxy_pass http://postsservice:80/api/v1/posts;
    }
	
    location / {
        try_files $uri /index.html;
    }
}