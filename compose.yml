x-postgres: &postgres
  image: postgres:${POSTGRES_VERSION}
  restart: unless-stopped
  networks:
    - appnet
  healthcheck:
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

services:

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      #KAFKA_CONFIG: "/opt/kafka/config/kraft/server.properties"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}

      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
    volumes:
      - kafka_data:/var/lib/kafka/data
    logging:
        driver: json-file
        options:
          max-size: "20m"
          max-file: "5"
    healthcheck:
      test:
          [
            "CMD-SHELL",
            "nc -z localhost 9092 || exit 1"
          ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s
    networks:
      - appnet

  kafka_init:
    image: apache/kafka:${KAFKA_VERSION}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      bash -c "
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list;
      do
        sleep 2;
      done;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic users.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic posts.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic users.events.dlq --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic posts.events.dlq --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic keycloak.user.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic keycloak.admin.events --partitions 1 --replication-factor 1;
      echo 'Topics created';
      "
    networks:
      - appnet

  postgres_users:
    <<: *postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${USERS_DB}
      POSTGRES_USER: ${USERS_USER}
      POSTGRES_PASSWORD: ${USERS_PASSWORD}
    volumes:
        - pgdata_users:/var/lib/postgresql/data
    healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U ${USERS_USER} -d ${USERS_DB}"
          ]

  postgres_posts:
    <<: *postgres
    ports:
      - "5434:5432"
    environment:
        POSTGRES_DB: ${POSTS_DB}
        POSTGRES_USER: ${POSTS_USER}
        POSTGRES_PASSWORD: ${POSTS_PASSWORD}
    volumes:
        - pgdata_posts:/var/lib/postgresql/data
    healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U ${POSTS_USER} -d ${POSTS_DB}"
          ]

networks:
  appnet:

volumes:
  kafka_data:
  pgdata_users:
  pgdata_posts: