
services:
    
    kafka:
        image: apache/kafka:4.1.1
        container_name: kafka
        restart: unless-stopped
        networks:
          - appnet
        ports:
          - "9092:9092"
        environment:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LOG_DIRS: "/var/lib/kafka/data"
          #KAFKA_CONFIG: "/opt/kafka/config/kraft/server.properties"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_NUM_PARTITIONS: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
          - kafka_data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 20

    kafka_init:
        image: apache/kafka:4.1.1
        container_name: kafka_init
        depends_on:
          kafka:
            condition: service_healthy
        networks:
          - appnet
        entrypoint: >
          bash -c "
          echo 'Waiting for Kafka...';
          sleep 10;
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic users.events --partitions 1 --replication-factor 1;
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic posts.events --partitions 1 --replication-factor 1;
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic users.events.dlq --partitions 1 --replication-factor 1;
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic posts.events.dlq --partitions 1 --replication-factor 1;
          echo 'Topics created';
          "
      
    kafka_ui:
        image: docker.redpanda.com/redpandadata/console:latest
        container_name: kafka_ui
        restart: unless-stopped
        ports:
          - "8080:8080"
        networks:
          - appnet
        environment:
          KAFKA_BROKERS: kafka:9092
        depends_on:
          kafka:
            condition: service_healthy
    
    kafka_exporter:
        image: danielqsj/kafka-exporter:latest
        container_name: kafka_exporter
        restart: unless-stopped
        ports:
          - "9308:9308"
        networks:
          - appnet
        command:
          - "--kafka.server=kafka:9092"
        depends_on:
          kafka:
            condition: service_healthy
    
    postgres_users:
        image: postgres:16
        container_name: postgres_users
        restart: unless-stopped
        environment:
          POSTGRES_USER: users_user
          POSTGRES_PASSWORD: users_pass
          POSTGRES_DB: usersdb
        ports:
          - "5433:5432"
        volumes:
          - pgdata_users:/var/lib/postgresql/data
        networks:
          - appnet
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U users_user -d usersdb"]
          interval: 5s
          timeout: 3s
          retries: 10
      
    postgres_posts:
        image: postgres:16
        container_name: postgres_posts
        restart: unless-stopped
        environment:
          POSTGRES_USER: posts_user
          POSTGRES_PASSWORD: posts_pass
          POSTGRES_DB: postsdb
        ports:
          - "5434:5432"
        volumes:
          - pgdata_posts:/var/lib/postgresql/data
        networks:
          - appnet
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U posts_user -d postsdb"]
          interval: 5s
          timeout: 3s
          retries: 10
      
    usersservice_migrations:
        build: ./UsersService/UsersService
        container_name: usersservice_migrations
        command: ["dotnet", "UsersService.dll", "--migrate"]
        depends_on:
          postgres_users:
            condition: service_healthy
        environment:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Host=postgres_users;Port=5432;Database=usersdb;Username=users_user;Password=users_pass;
        restart: "no"
        networks:
          - appnet
      
    postsservice_migrations:
        build: ./PostsService/PostsService
        container_name: postsservice_migrations
        command: ["dotnet", "PostsService.dll", "--migrate"]
        depends_on:
          postgres_posts:
            condition: service_healthy
        environment:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Host=postgres_posts;Port=5432;Database=postsdb;Username=posts_user;Password=posts_pass;
        restart: "no"
        networks:
          - appnet
      
    usersservice:
        build: ./UsersService/UsersService
        container_name: usersservice
        restart: unless-stopped
        ports:
            - "7113:80"
        networks:
            - appnet
        depends_on:
          usersservice_migrations:
            condition: service_completed_successfully
          kafka:
            condition: service_healthy
          kafka_init:
            condition: service_completed_successfully
        healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
          interval: 10s
          timeout: 3s
          retries: 5
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings_DefaultConnection: Host=postgres_users;Port=5432;Database=usersdb;Username=users_user;Password=users_pass;
            APPLY_MIGRATIONS: "false"

    postsservice:
        build: ./PostsService/PostsService
        container_name: postsservice
        restart: unless-stopped
        ports:
            - "7245:80"
        networks:
            - appnet
        depends_on:
          postsservice_migrations:
            condition: service_completed_successfully
          kafka:
            condition: service_healthy
          kafka_init:
            condition: service_completed_successfully
        healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
          interval: 10s
          timeout: 3s
          retries: 5
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings_DefaultConnection: Host=postgres_posts;Port=5432;Database=postsdb;Username=posts_user;Password=posts_pass;
            APPLY_MIGRATIONS: "false"

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        ports:
          - "9090:9090"
        networks:
          - appnet
        volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
        depends_on:
          - usersservice
          - postsservice

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
          - "3000:3000"
        networks:
          - appnet
        depends_on:
          - prometheus

    jaeger:
        image: jaegertracing/all-in-one:latest
        container_name: jaeger
        ports:
          - "16686:16686"   # UI
          - "6831:6831/udp" # agent
        networks:
          - appnet

    react_web_client:
        build: ./ReactWebClient
        container_name: react_web_client
        ports:
            - "5173:80"
        networks:
            - appnet
        depends_on:
          - usersservice
          - postsservice

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
        container_name: elasticsearch
        environment:
          - discovery.type=single-node
          - xpack.security.enabled=false
          - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
          - "9200:9200"
        networks:
          - appnet
        volumes:
          - es_data:/usr/share/elasticsearch/data
        healthcheck:
          test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
          interval: 30s
          timeout: 10s
          retries: 5

    kibana:
        image: docker.elastic.co/kibana/kibana:9.2.2
        container_name: kibana
        depends_on:
          elasticsearch:
            condition: service_healthy
        environment:
          - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
        ports:
          - "5601:5601"
        networks:
          - appnet

    filebeat:
        image: docker.elastic.co/beats/filebeat:9.2.2
        container_name: filebeat
        user: root
        command: filebeat -e --strict.perms=false
        networks:
          - appnet
        depends_on:
          elasticsearch:
            condition: service_healthy
        volumes:
          - /var/lib/docker/containers:/var/lib/docker/containers:ro
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
        
networks:
  appnet:
    driver: bridge
    
volumes:
  kafka_data:
    driver: local
  pgdata_users:
  pgdata_posts:
  es_data: